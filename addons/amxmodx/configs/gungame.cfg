// ============================================================================
// GENERAL SETTINGS
// ============================================================================

// Enable or disable GunGame.
gg_enabled 1

// Map voting system.
gg_vote_setting 4

// Custom command used to start a map vote.
gg_vote_custom ""

// Custom command used to change the map.
gg_changelevel_custom ""

// Server commands executed when GunGame starts.
gg_map_setup "mp_timelimit 45; mp_winlimit 0; sv_alltalk 0; mp_chattime 10; mp_c4timer 25"

// Server commands executed when a GunGame match ends.
gg_endmap_setup ""

// Display the welcome message to joining players.
gg_join_msg 1

// Enable GunGame gameplay messages.
gg_messages 1

// Preserve disconnected players' temporary progress in seconds.
gg_save_temp 300

// Configure the GunGame status display.
gg_status_display 1

// Number of GunGame matches played before changing the map.
gg_map_iterations 1

// Configure bot participation in GunGame statistics.
gg_ignore_bots 1

// Control map-provided weapons and equipment.
gg_block_equips 2

// Enable the leader display.
gg_leader_display 1

// Horizontal position of the leader display.
gg_leader_display_x -1.0

// Vertical position of the leader display.
gg_leader_display_y 0.0

// Control team switching during GunGame.
gg_allow_changeteam 2

// Disable the standard Counter-Strike money system.
gg_disable_money 1

// Configure the winner MOTD display.
//gg_winner_motd 1
//gg_winner_motd "https://example.tld/motd.php"
gg_winner_motd 1

// Winner MOTD SQL history mode.
// 0 = Replace previous match results of this server.
// 1 = Keep all match results of this server.
gg_winner_motd_history 1

// Enable AFK protection.
gg_afk_protection 0

// Number of players displayed per ranking menu page.
gg_top10_ppp 8


// ============================================================================
// DEBUG SETTINGS
// ============================================================================

// Runtime debug levels: 0 = Off, 1 = Critical, 2 = Diagnostics,
// 3 = Detailed tracing, 4 = All available diagnostics.
// Global and category levels are additive (highest applicable level wins).
// SQL also enables all existing SQL-related category diagnostics.
// Operational errors are always logged.
gg_debug 0

// Sql diagnostics.
gg_debug_sql 0

// Stats diagnostics.
gg_debug_stats 0

// Ranking diagnostics.
gg_debug_ranking 0

// Handicap diagnostics. Reserved for future instrumentation.
gg_debug_handicap 0

// Spawn diagnostics. Reserved for future instrumentation.
gg_debug_spawn 0

// Motd diagnostics.
gg_debug_motd 0

// Cache diagnostics.
gg_debug_cache 0


// ============================================================================
// AUTOMATIC VOTING
// ============================================================================

// Configure automatic voting to enable or disable GunGame.
gg_autovote_mode 0

// Number of rounds before starting an automatic vote.
gg_autovote_rounds 1

// Delay before starting the vote in seconds.
gg_autovote_delay 8.0

// Required proportion of votes to pass.
gg_autovote_ratio 0.51

// Voting duration in seconds.
gg_autovote_time 10.0


// ============================================================================
// STATISTICS SETTINGS
// ============================================================================

// Statistics storage backend:
// 0 = Local file storage
// 1 = MySQL / MariaDB
gg_stats_backend 0

// Refresh the player's statistics timestamp on join:
// 0 = Disabled
// 1 = Enabled
// 2 = Automatic (disabled for files, enabled for SQL)
gg_stats_refresh_on_join 2

// Player identification:
// 0 = SteamID
// 1 = IP address
// 2 = Player name
gg_stats_ip 0

// Remove inactive statistics after this many seconds.
// 2592000 = 30 days
gg_stats_prune 2592000

// Statistics and ranking mode.
gg_stats_mode 2

// Maintain separate regular and teamplay statistics.
gg_stats_split 0

// Bonus multiplier awarded to the match winner.
gg_stats_winbonus 1.5


// ============================================================================
// LOCAL FILE STORAGE
// ============================================================================
//
// Only used whengg_stats_backend is set to 0.
// All settings in this section are ignored when SQL is enabled.
//

// Player statistics filename.
gg_stats_file "gungame.stats"

// Winning streak statistics filename.
gg_stats_streak_file "gungame.streaks"


// ============================================================================
// SQL STORAGE
// ============================================================================
//
// Only used when gg_stats_backend is set to 1.
//
// Leave all four connection settings empty to use the central
// AMX Mod X SQL configuration (configs/sql.cfg).
//
// To use a separate GunGame database, specify host, user and database.
// An empty password is allowed.
//

gg_sql_host ""
gg_sql_user ""
gg_sql_pass ""
gg_sql_db ""

// GunGame table names.
// Used with both AMX Mod X and custom SQL connections.
gg_sql_table "gg_stats"
gg_sql_streak_table "gg_streaks"
gg_sql_winmotd_table "gg_winmotd"

// ============================================================================
// DEATHMATCH SETTINGS
// ============================================================================

// Enable GunGame Deathmatch respawning.
gg_dm 1

// Spawn protection duration in seconds.
gg_dm_sp_time 1.0

// Spawn protection mode.
gg_dm_sp_mode 1

// Configure random spawn locations.
gg_dm_spawn_random 2

// Enable random spawn locations at round start.
gg_dm_start_random 1

// Respawn delay after death in seconds.
gg_dm_spawn_delay 3.0

// Allow respawning after the bomb has been planted.
gg_dm_spawn_afterplant 1

// Configure corpse handling in Deathmatch mode.
gg_dm_corpses 1

// Configure the respawn countdown display.
gg_dm_countdown 2


// ============================================================================
// MAP OBJECTIVES
// ============================================================================

// Control standard Counter-Strike map objectives.
gg_block_objectives 0

// Level reward for planting or defusing the bomb.
gg_bomb_defuse_lvl 1

// Hostage touch reward.
gg_host_touch_reward 2

// Hostage rescue reward.
gg_host_rescue_reward 2

// Hostage kill reward.
gg_host_kill_reward 1

// Hostage kill penalty.
gg_host_kill_penalty 1


// ============================================================================
// TEAMPLAY SETTINGS
// ============================================================================

// Enable GunGame teamplay mode.
gg_teamplay 0

// Knife level kill requirement multiplier in teamplay mode.
gg_teamplay_knife_mod 0.33

// Grenade level kill requirement multiplier in teamplay mode.
gg_teamplay_nade_mod 0.50

// Enable teamplay time-ratio handling.
gg_teamplay_timeratio 1


// ============================================================================
// GAMEPLAY SETTINGS
// ============================================================================

// Automatically manage friendly fire during GunGame.
gg_ff_auto 1

// Default weapon progression order.
gg_weapon_order "glock18,usp,p228,deagle,fiveseven,elite,m3,xm1014,tmp,mac10,mp5navy,ump45,p90,galil,famas,ak47,scout,m4a1,sg552,aug,m249,hegrenade,knife"

// Maximum level gains per round.
gg_max_lvl 3

// Enable triple-level bonus mode.
gg_triple_on 0

// Give the next weapon immediately after leveling up.
gg_turbo 1

// Enable knife level stealing.
gg_knife_pro 1

// Restrict weapon use after leveling up until respawn.
gg_knife_elite 0

// Level penalty for committing suicide.
gg_suicide_penalty 1

// Treat deaths caused by the world as suicides.
gg_worldspawn_suicide 1

// Allow players to pick up weapons from other levels.
gg_pickup_others 0

// Configure the handicap system for joining players.
gg_handicap_on 1

// Configure handicap eligibility for top-ranked players.
gg_top10_handicap 1

// Number of kills required to advance one level.
gg_kills_per_lvl 2

// Kill requirement multiplier for bot kills.
gg_kills_botmod 1.0

// Armor amount given to players.
gg_give_armor 100

// Give players a helmet.
gg_give_helmet 1

// Amount of reserve ammunition given to players.
gg_ammo_amount 200

// Refill ammunition after a kill.
gg_refill_on_kill 1

// Level penalty for killing a teammate.
gg_tk_penalty 1

// Restrict AWP ammunition to one loaded round.
gg_awp_oneshot 1


// ============================================================================
// WARMUP SETTINGS
// ============================================================================

// Warmup duration in seconds (0 = disabled).
gg_warmup_timer_setting 60

// Weapon used during warmup.
gg_warmup_weapon "knife"

// Configure warmup for multiple matches on the same map.
gg_warmup_multi 0


// ============================================================================
// GRENADE LEVEL SETTINGS
// ============================================================================

// Give a Glock during the grenade level.
gg_nade_glock 1

// Give smoke grenades during the grenade level.
gg_nade_smoke 0

// Give flashbangs during the grenade level.
gg_nade_flash 0

// Configure additional grenades during the grenade level.
gg_extra_nades 1

// Grenade replenishment interval in seconds.
gg_nade_refresh 5.0


// ============================================================================
// BOT SETTINGS
// ============================================================================

// Allow bots to skip the grenade level.
gg_bots_skipnade 0

// Allow knife level stealing from bots.
gg_bots_knifeable 1


// ============================================================================
// SOUND SETTINGS
// ============================================================================
//
// Configure GunGame event sounds.
// Sound paths are relative to the game directory.
//

// Sound played when gaining a level.
gg_sound_levelup "sound/gungame/gg_levelup.wav"

// Sound played when losing a level.
gg_sound_leveldown "sound/ambience/xtal_down1(e70)"

// Sound played when stealing a level.
gg_sound_levelsteal "sound/turret/tu_die.wav"

// Sound played when reaching the grenade level.
gg_sound_nade "sound/gungame/gg_nade_level.wav"

// Sound played when reaching the knife level.
gg_sound_knife "sound/gungame/gg_knife_level.wav"

// Welcome sound played when joining GunGame.
gg_sound_welcome "sound/gungame/gg_welcome.wav"

// Sound played when activating the triple-level bonus.
gg_sound_triple "sound/gungame/gg_triple.wav"

// Match winner sounds (semicolon-separated).
gg_sound_winner "media/Half-Life03.mp3;media/Half-Life08.mp3;media/Half-Life11.mp3;media/Half-Life17.mp3"

// Sound played when taking the lead.
gg_sound_takenlead "sound/gungame/gg_takenlead.wav"

// Sound played when tying the lead.
gg_sound_tiedlead "sound/gungame/gg_tiedlead.wav"

// Sound played when losing the lead.
gg_sound_lostlead "sound/gungame/gg_lostlead.wav"

// Configure leader sound playback.
gg_lead_sounds 0.9


// ============================================================================
// RANDOM WEAPON ORDERS
// ============================================================================
