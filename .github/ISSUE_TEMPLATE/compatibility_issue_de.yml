name: Kompatibilitätsproblem (DE)
description: Kompatibilitätsproblem melden.
labels:
- compatibility
body:
- type: markdown
  attributes:
    value: Entferne Passwörter, Tokens, private Adressen und personenbezogene Daten.
      Nutze Discussions für Installations- und Konfigurationshilfe.
- type: input
  id: version
  attributes:
    label: GunGame-Version
  validations:
    required: true
- type: dropdown
  id: game
  attributes:
    label: Spiel
    options:
    - Counter-Strike 1.6
    - Condition Zero
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Umgebung (AMX Mod X, Engine, GameDLL, relevante Plugins)
  validations:
    required: true
- type: dropdown
  id: backend
  attributes:
    label: Statistik-Backend
    options:
    - Local
    - SQL
    - Unbekannt / nicht relevant
  validations:
    required: true
- type: input
  id: database
  attributes:
    label: Datenbankversion (bei SQL-Nutzung)
  validations:
    required: false
- type: input
  id: component
  attributes:
    label: Betroffene Komponente und genaue Version
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Schritte zur Reproduktion
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Erwartetes Verhalten
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Tatsächliches Verhalten
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Bereinigte Logs und Diagnosedaten
  validations:
    required: false
